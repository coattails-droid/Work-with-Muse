name: failure-detective

# Watches crypto-paper-agent. When a run fails, this workflow reads the failed
# logs, diagnoses the likely cause, and opens a GitHub issue with a suggested
# fix. It never touches code or retries anything on its own.

on:
  workflow_run:
    workflows: ["crypto-paper-agent"]
    types: [completed]

permissions:
  actions: read   # read run + job logs
  issues: write   # open diagnosis issues

jobs:
  diagnose:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diagnose failure and open issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python bot/failure_detective.py
