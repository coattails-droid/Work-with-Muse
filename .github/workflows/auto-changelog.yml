name: auto-changelog

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Catch commits pushed by bots using GITHUB_TOKEN (those don't fire push events)
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-changelog
  cancel-in-progress: false

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    # Avoid infinite loops from our own bot commits
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: update changelog') }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and insert changelog entry
        if: github.event_name == 'push'
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail

          SUMMARY="$(printf '%s\n' "$COMMIT_MSG" | head -n 1 | tr -d '\r')"
          if [ -n "${COMMIT_TIMESTAMP:-}" ]; then
            DATE="$(date -u -d "$COMMIT_TIMESTAMP" +%Y-%m-%d 2>/dev/null || date -u +%Y-%m-%d)"
            STAMP="$(date -u -d "$COMMIT_TIMESTAMP" +%Y-%m-%dT%H:%MZ 2>/dev/null || date -u +%Y-%m-%dT%H:%MZ)"
          else
            DATE="$(date -u +%Y-%m-%d)"
            STAMP="$(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          AUTHOR="${COMMIT_AUTHOR:-unknown}"
          SHORT="${COMMIT_SHA:0:7}"

          if git rev-parse "${COMMIT_SHA}^" >/dev/null 2>&1; then
            mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$COMMIT_SHA")
          else
            CHANGED=("(initial commit / no parent)")
          fi
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            CHANGED=("(no file list available)")
          fi

          {
            echo "### ${DATE} — ${SUMMARY}"
            echo
            echo "- **SHA:** \`${SHORT}\`"
            echo "- **When:** ${STAMP} UTC"
            echo "- **Author:** ${AUTHOR}"
            echo "- **Summary:** ${SUMMARY}"
            echo "- **Files:**"
            count=0
            for f in "${CHANGED[@]}"; do
              count=$((count + 1))
              if [ "$count" -le 80 ]; then
                echo "  - ${f}"
              fi
            done
            if [ "${#CHANGED[@]}" -gt 80 ]; then
              echo "  - … and $((${#CHANGED[@]} - 80)) more"
            fi
            echo
          } > /tmp/changelog-entry.md

          python3 <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          entry = Path("/tmp/changelog-entry.md").read_text(encoding="utf-8")
          if not path.exists():
              path.write_text(
                  "# Changelog\n\n"
                  "This file is maintained automatically by `.github/workflows/auto-changelog.yml`.\n\n"
                  "## Format\n\n"
                  "Each push (except bot changelog commits) prepends a new entry below **Entries**.\n\n"
                  "---\n\n"
                  "## Entries\n\n" + entry,
                  encoding="utf-8",
              )
          else:
              text = path.read_text(encoding="utf-8")
              marker = "## Entries"
              idx = text.find(marker)
              if idx == -1:
                  path.write_text(text.rstrip() + "\n\n## Entries\n\n" + entry, encoding="utf-8")
              else:
                  line_end = text.find("\n", idx)
                  if line_end == -1:
                      line_end = len(text)
                  insert_at = line_end + 1
                  if insert_at < len(text) and text[insert_at] == "\n":
                      insert_at += 1
                  path.write_text(text[:insert_at] + entry + text[insert_at:], encoding="utf-8")
          print("Inserted changelog entry for", Path("/tmp/changelog-entry.md").read_text().splitlines()[0])
          PY

      - name: Append machine-readable ledger entries
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PUSHER: ${{ github.event.pusher.name }}
        run: python3 bot/change_ledger.py

      - name: Commit changelog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md ledger/changes.jsonl
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
            exit 0
          fi
          git commit -m "chore: update changelog"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
