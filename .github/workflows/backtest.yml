name: backtest

# Manually-triggered strategy backtest. Replays the DCA value paper
# strategy over historical daily prices and uploads the results. Paper only:
# nothing here can place real orders.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'History window in days'
        required: false
        default: '730'
      take_profit_mult:
        description: 'Exit: sell full position at this multiple of coin DCA (e.g. 1.30)'
        required: false
        default: '1.30'
      monthly_contrib:
        description: 'Paper cash contributed on the 1st of each month'
        required: false
        default: '100'

permissions:
  contents: read
  actions: write   # upload results artifact

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run backtest
        env:
          TAKE_PROFIT_MULT: ${{ github.event.inputs.take_profit_mult || '1.30' }}
          MONTHLY_CONTRIB: ${{ github.event.inputs.monthly_contrib || '100' }}
        run: python bot/backtest.py --days ${{ github.event.inputs.days || '730' }} --out backtest_results.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_id }}
          path: backtest_results.json
